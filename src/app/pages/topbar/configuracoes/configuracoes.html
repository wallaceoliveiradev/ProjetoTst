  @if (abaAtiva === 'usuarios') {
    <article class="settings-card">
      <header class="card-header">
        <section>
          <h2>Usuários do sistema</h2>
          <p>Gerencie os acessos e os perfis dos usuários.</p>
        </section>

            Buscar usuário
          </label>

          <i class="bi bi-search" aria-hidden="true"></i>

            name="buscarUsuario"
            type="search"

          />

      </header>

      <section class="table-responsive">

            <tr>
              <th scope="col">Usuário</th>
              <th scope="col">Perfil</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end">Ações</th>
            </tr>
          </thead>

                    [class.admin-profile]="usuario.perfil === 'Administrador'"
                    [class.rh-profile]="usuario.perfil === 'RH'"
                    [class.safety-profile]="

                </td>

                    [class.active-status]="usuario.ativo"
                    [class.inactive-status]="!usuario.ativo"

                    type="button"
                    class="action-button"
                    aria-label="Editar usuário"
                    title="Editar"
                  >
                    <i class="bi bi-pencil" aria-hidden="true"></i>
                  </button>

                  <button
                    type="button"
                    class="action-button"
                    aria-label="Redefinir senha"
                    title="Redefinir senha"
                  >
                    <i class="bi bi-key" aria-hidden="true"></i>
                  </button>

                  <button
                    type="button"
                    class="status-button"
                    [attr.aria-label]="
                      usuario.ativo
                        ? 'Inativar usuário'
                        : 'Ativar usuário'
                    "
                    [title]="usuario.ativo ? 'Inativar' : 'Ativar'"
                    (click)="alternarStatus(usuario)"
                  >
                    <i
                      class="bi"
                      [class.bi-person-dash]="usuario.ativo"

                  </section>
                </td>
              </tr>
            }

    </article>

  @if (abaAtiva === 'perfis') {
    <section class="profile-grid">
      @for (perfil of perfis; track perfil.nome) {
        <article class="profile-option">
          <span class="option-icon">
            @if (perfil.nome === 'Administrador') {
              <i class="bi bi-shield-check" aria-hidden="true"></i>
            } @else if (perfil.nome === 'RH') {
              <i class="bi bi-people" aria-hidden="true"></i>
            } @else {
              <i class="bi bi-cone-striped" aria-hidden="true"></i>
            }
          </span>

          <header>
            <h2>{{ perfil.nome }}</h2>
            <p>{{ perfil.descricao }}</p>
          </header>

          <section
            class="profile-permissions"
            aria-label="Permissões do perfil"
          >
            <span class="permission-count">
              {{ perfil.permissoes.length }} permissões
            </span>

            <ul>
              @for (permissao of perfil.permissoes; track permissao) {
                <li>
                  <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                  {{ permissao }}
                </li>
              }
            </ul>
          </section>

          <button
            type="button"
            class="btn btn-outline-primary manage-permissions-button"
            (click)="abrirPermissoes(perfil.nome)"
          >
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
            Gerenciar permissões
          </button>
        </article>
      }
    </section>
  }

  @if (abaAtiva === 'permissoes') {

      <header class="card-header permissions-header">

            name="perfilPermissao"
            class="form-select"
            [(ngModel)]="perfilSelecionado"
          >
            @for (perfil of perfis; track perfil.nome) {
              <option [value]="perfil.nome">
                {{ perfil.nome }}
              </option>
            }
          </select>
        </section>
      </header>

      <section class="selected-profile-summary">

          <span>
            {{ perfilAtual()?.descricao }}

        </section>

      <section class="permission-list">
        <article class="permission-item">

        </article>

        <article class="permission-item">

            />

        </article>

        <article class="permission-item">

        </article>

        <article class="permission-item">

        </article>
      </section>
    </article>
