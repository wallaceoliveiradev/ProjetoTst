<header class="topbar">
  <div class="search-box">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input
      type="search"
      aria-label="Pesquisar no sistema"
      placeholder="Pesquisar..."
      [value]="searchTerm"
      (input)="searchTerm = $any($event.target).value"
      (keydown.enter)="buscar()"
    />
  </div>
  <div class="topbar-right">
    @if (authService.isAdmin()) {
      <button
        type="button"
        class="icon-btn"
        aria-label="Solicitações de EPI"
        (click)="abrirSolicitacoes()"
      >
        <i class="bi bi-bell" aria-hidden="true"></i>
        @if (solicitacoesPendentes > 0) {
          <span class="notification-count">{{ solicitacoesPendentes }}</span>
        }
      </button>
    }
    <details class="account" (keydown.escape)="fecharConta($event)">
      <summary aria-label="Abrir opções da conta">
        <i class="bi bi-person-circle account-avatar" aria-hidden="true"></i>
        <span class="account-summary"
          ><strong>{{ authService.getUsuarioLogado()?.nome || 'Usuário' }}</strong
          ><small>{{ authService.isAdmin() ? 'Administrador' : 'Colaborador' }}</small></span
        >
        <i class="bi bi-chevron-down account-chevron" aria-hidden="true"></i>
      </summary>
      <div class="account-menu">
        <div class="account-info">
          <strong>{{ authService.getUsuarioLogado()?.nome || 'Usuário' }}</strong
          ><small>{{ authService.isAdmin() ? 'Administrador' : 'Colaborador' }}</small>
        </div>
        <a routerLink="/sistema/perfil" (click)="fecharConta($event)"
          ><i class="bi bi-person" aria-hidden="true"></i> Meu perfil</a
        >
        <button type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
        </button>
      </div>
    </details>
  </div>
</header>
