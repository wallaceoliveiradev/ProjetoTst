<aside class="sidebar" aria-label="Menu principal">
  <div class="brand">
    <img
      class="brand-logo"
      src="/assets/logo03.png"
      alt="Crisântemos — Saúde e Segurança do Trabalho"
    />
  </div>
  <nav aria-label="Navegação do sistema">
    <ul>
      @if (authService.isColaborador()) {
        <li>
          <a
            routerLink="/sistema"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            aria-label="Visão geral"
            title="Visão geral"
            ><i class="bi bi-grid-1x2" aria-hidden="true"></i
            ><span class="nav-label">Visão geral</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/meus-epis"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Meus EPIs"
            title="Meus EPIs"
            ><i class="bi bi-shield-check" aria-hidden="true"></i
            ><span class="nav-label">Meus EPIs</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/treinamentos"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Treinamentos"
            title="Treinamentos"
            ><i class="bi bi-journal-bookmark" aria-hidden="true"></i
            ><span class="nav-label">Treinamentos</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/riscos"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Riscos"
            title="Riscos"
            ><i class="bi bi-exclamation-triangle" aria-hidden="true"></i
            ><span class="nav-label">Riscos</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/suporte"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Suporte"
            title="Suporte"
            ><i class="bi bi-life-preserver" aria-hidden="true"></i
            ><span class="nav-label">Suporte</span></a
          >
        </li>
      } @else {
        <li>
          <a
            routerLink="/sistema"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            aria-label="Visão geral"
            title="Visão geral"
            ><i class="bi bi-grid-1x2" aria-hidden="true"></i
            ><span class="nav-label">Visão geral</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/treinamentos"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Treinamentos"
            title="Treinamentos"
            ><i class="bi bi-journal-bookmark" aria-hidden="true"></i
            ><span class="nav-label">Treinamentos</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/epis-admin"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Controle de EPIs"
            title="Controle de EPIs"
            ><i class="bi bi-shield-check" aria-hidden="true"></i
            ><span class="nav-label">Controle de EPIs</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/riscos"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Gestão de riscos"
            title="Gestão de riscos"
            ><i class="bi bi-exclamation-triangle" aria-hidden="true"></i
            ><span class="nav-label">Gestão de riscos</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/checklist"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Checklist de segurança"
            title="Checklist de segurança"
            ><i class="bi bi-clipboard-check" aria-hidden="true"></i
            ><span class="nav-label">Checklist de segurança</span></a
          >
        </li>
        <li>
          <a
            routerLink="/sistema/relatorios"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            aria-label="Relatórios"
            title="Relatórios"
            ><i class="bi bi-bar-chart-line" aria-hidden="true"></i
            ><span class="nav-label">Relatórios</span></a
          >
        </li>
        @if (authService.isAdmin()) {
          <li>
            <a
              routerLink="/sistema/usuarios"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              aria-label="Usuários"
              title="Usuários"
              ><i class="bi bi-people" aria-hidden="true"></i
              ><span class="nav-label">Usuários</span></a
            >
          </li>
        }
      }
    </ul>
  </nav>
</aside>
